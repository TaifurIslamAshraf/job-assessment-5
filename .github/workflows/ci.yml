name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job that touches Prisma needs this at generate time.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payroll_test?schema=public
  REDIS_URL: redis://localhost:6379

jobs:
  # Fast feedback: no services needed, fails the PR on style/type/build errors.
  static:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm build

  # The interesting guarantees (idempotency, retries, ordering, recovery) only
  # hold against real Postgres and Redis, so integration tests get both.
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payroll_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter api db:deploy

      - name: Unit tests
        run: pnpm --filter api test

      - name: Integration / e2e tests
        run: pnpm --filter api test:e2e
        env:
          # Deterministic provider: retry behaviour is exercised by tests that
          # inject failures explicitly, not by chance.
          PAYROLL_FAILURE_RATE: "0"

  # Proves `docker compose up` still works — the reviewer's first command.
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the full stack and probe health
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then
              echo "API healthy"; exit 0
            fi
            sleep 5
          done
          echo "API never became healthy"; docker compose logs; exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
