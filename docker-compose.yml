# Full local environment: `docker compose up --build`
#
#   web   :3000  minimal frontend
#   api   :3001  HTTP, produces jobs
#   worker  --   consumes jobs, no HTTP
#   postgres :5432
#   redis    :6379

name: payroll

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payroll?schema=public
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
  STALE_CLAIM_MS: ${STALE_CLAIM_MS:-120000}
  PAYROLL_FAILURE_RATE: ${PAYROLL_FAILURE_RATE:-0.25}
  PAYROLL_LATENCY_MS: ${PAYROLL_LATENCY_MS:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payroll
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payroll"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on: a restart must not lose queued jobs.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies migrations once, then exits. Both api and worker wait for it, so
  # neither starts against a schema that does not exist yet.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-env
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    command: ["node", "dist/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Scale with `docker compose up --scale worker=3` to exercise the
    # multi-worker guarantees.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side proxy target. The browser never sees this address.
      API_ORIGIN: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
